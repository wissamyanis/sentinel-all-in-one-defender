<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a3a"/>
      <stop offset="0.55" stop-color="#0f2a5e"/>
      <stop offset="1" stop-color="#123a8a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ea0ff"/>
      <stop offset="1" stop-color="#1666d0"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff9d17"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1000" height="320" rx="24" fill="url(#bg)"/>

  <!-- subtle grid accent -->
  <g stroke="#2b4b8f" stroke-width="1" opacity="0.35">
    <line x1="0" y1="80" x2="1000" y2="80"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
  </g>

  <!-- Shield with speed motion lines -->
  <g filter="url(#soft)">
    <g opacity="0.5" stroke="#7fc0ff" stroke-width="6" stroke-linecap="round">
      <line x1="70" y1="120" x2="120" y2="120"/>
      <line x1="55" y1="160" x2="115" y2="160"/>
      <line x1="70" y1="200" x2="120" y2="200"/>
    </g>
    <path d="M225 55 L320 95 L320 175 C320 235 275 265 225 285 C175 265 130 235 130 175 L130 95 Z" fill="url(#shield)"/>
    <path d="M225 70 L305 103 L305 173 C305 223 268 250 225 268 C182 250 145 223 145 173 L145 103 Z" fill="#0f2a5e" opacity="0.35"/>
    <!-- lightning bolt -->
    <path d="M238 105 L192 185 L222 185 L210 240 L262 158 L228 158 Z" fill="url(#bolt)"/>
  </g>

  <!-- Text -->
  <text x="365" y="132" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="1">Microsoft Sentinel</text>
  <text x="365" y="196" font-size="58" font-weight="800" fill="#ffd23f" letter-spacing="1">Accelerated</text>
  <text x="367" y="244" font-size="34" font-weight="600" fill="#a9c7ff" letter-spacing="6">ALL-IN-ONE</text>

  <!-- Defender portal tag -->
  <g transform="translate(367,262)">
    <rect x="0" y="0" width="340" height="36" rx="18" fill="#1b3f86" stroke="#3ea0ff" stroke-width="1.5"/>
    <circle cx="24" cy="18" r="6" fill="#4ade80"/>
    <text x="40" y="18" font-size="17" font-weight="600" fill="#dbe8ff" dominant-baseline="central">Microsoft Defender portal ready</text>
  </g>
</svg>
